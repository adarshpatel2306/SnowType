<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=yes">
  <title>SnowType</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="..."/></svg>
      SnowType
    </h1>
    <div id="header">
      <div id="info"></div>
      <div id="buttons">
        <input type="number" id="timeInput" placeholder="Time (sec)" min="5" max="300" style="width: 100px; margin-right: 10px;">
        <button id="newGameBtn">New Game</button>
      </div>
    </div>
    <div id="game" tabindex="0">
      <div id="words"></div>
      <div id="cursor"></div>
      <div id="focus-error">Click here to focus</div>
    </div>
  </main>
  <script src="typing.js"></script>
</body>
</html>
